<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tracking Layout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Barlow:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../images/favicon-32x32.png" type="image/png">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="#" class="nav__brand">
                <img src="../images/logo.svg" alt="Project Tracking Logo">
            </a>
            
            <button class="nav__toggle" aria-label="Open menu">
                <img src="../images/icon-hamburger.svg" alt="Menu icon">
            </button>
            
            <ul class="nav__list">
                <li class="nav__item"><a href="#" class="nav__link">Product</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Features</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Pricing</a></li>
                <li class="nav__item nav__separator"></li>
                <li class="nav__item"><a href="#" class="nav__link nav__link--muted">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="hero">
            <article class="hero__content">
                <p class="hero__badge">
                    <span class="hero__badge-tag">New</span> Monograph Dashboard
                </p>
                <h1 class="hero__title">Powerful insights into your team</h1>
                <p class="hero__text">Project planning and time tracking for agile teams.</p>
                <section class="hero__actions">
                    <button class="button">Schedule a demo</button>
                    <span class="hero__note">to see a preview</span>
                </section>
            </article>
            
            <figure class="hero__illustration">
                <img src="../images/illustration-devices.svg" alt="Devices illustration">
            </figure>
        </section>
    </main>
</body>
</html>
